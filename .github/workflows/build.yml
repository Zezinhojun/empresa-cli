name: Build

on:
  workflow_call:
    inputs:
      staging:
        description: 'Adiciona o sufixo -staging.<run_number> à versão do pacote'
        type: boolean
        default: false

jobs:
  build:
    name: Build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Versão de staging
        if: inputs.staging
        shell: bash
        run: npm version "$(node -p "require('./package.json').version")-staging.${{ github.run_number }}" --no-git-tag-version
      - name: Smoke test do pacote instalado
        run: npm run smoke
      - name: Contrato de uso por agentes (sem TTY, --json, exit codes)
        run: npm run contract
      - name: Empacota o artefato publicável
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: mkdir -p out && npm pack --pack-destination out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: package-tgz
          path: out/*.tgz
          if-no-files-found: error