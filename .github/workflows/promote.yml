name: Promote to production

# Manual. Promove uma versão validada em staging para `latest` publicando a
# versão estável X.Y.Z a partir da master. Veja docs/adr/0001-versionamento-e-canais.md.

on:
  workflow_dispatch:
    inputs:
      staging_version:
        description: 'Versão validada em staging (ex.: 1.0.0-staging.57)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  verify:
    name: Verifica e constrói a partir da master
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      STAGING: ${{ inputs.staging_version }}
    steps:
      - name: Publicação habilitada?
        env:
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::error::Defina a variável de repositório NPM_PUBLISH_ENABLED=true para publicar."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Valida as versões
        id: v
        run: |
          case "$STAGING" in
            *-staging.*) ;;
            *) echo "::error::'$STAGING' não é uma versão de staging (X.Y.Z-staging.N)"; exit 1 ;;
          esac
          VERSION="${STAGING%%-staging.*}"
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            echo "::error::A master está em $CURRENT; esperado $VERSION (promova develop -> master antes)."
            exit 1
          fi
          npm view "$NAME@$STAGING" version > /dev/null || { echo "::error::$NAME@$STAGING não existe no npm"; exit 1; }
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION já foi publicada"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run smoke
      - name: Código da master == código testado em staging
        env:
          NAME: ${{ steps.v.outputs.name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir staging && cd staging
          npm pack "$NAME@$STAGING" --silent > /dev/null
          tar -xzf ./*.tgz
          cd ..
          # a única diferença esperada é a string de versão embutida no bundle
          sed "s/$STAGING/$VERSION/g" staging/package/dist/index.js > staging-index.js
          diff -u staging-index.js dist/index.js && echo "dist/index.js idêntico ao validado em staging"
      - name: Empacota
        run: mkdir -p out && npm pack --pack-destination out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tgz
          path: out/*.tgz
          if-no-files-found: error

  publish:
    name: Publica latest + GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    environment: production # revisor obrigatório
    permissions:
      contents: write # tag + release
      id-token: write # provenance
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-tgz
          path: pkg
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: npm publish (latest)
        run: npm publish pkg/*.tgz --tag latest --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub Release
        run: gh release create "v$VERSION" --target master --title "v$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}