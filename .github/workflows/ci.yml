name: CI - VOX CLI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: write

  # Gera e valida (smoke) o tarball que será publicado. Em push na develop a
  # versão recebe o sufixo -staging.<run_number>.
  build:
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    with:
      staging: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}

  # Só roda na develop e só quando NPM_PUBLISH_ENABLED=true (variável do repo).
  # Produção nunca passa por aqui: ver promote.yml.
  publish-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.NPM_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/publish.yml
    secrets: inherit